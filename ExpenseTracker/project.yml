name: ExpenseTracker
options:
  bundleIdPrefix: com.expensetracker
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: false

# The shared sources are compiled directly into the app (and test) target
# rather than into a separate framework. This keeps the model types
# (Transaction, Category, …) local to the module, so they take precedence
# over same-named system types like SwiftUI.Transaction instead of being
# ambiguous across a module boundary.
targets:
  ExpenseTrackerMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: MacApp
      - path: Shared/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.expensetracker.mac
        INFOPLIST_GENERATION: true
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "Expense Tracker"
        SWIFT_EMIT_LOC_STRINGS: true
        CODE_SIGN_ENTITLEMENTS: MacApp/ExpenseTrackerMac.entitlements
    entitlements:
      path: MacApp/ExpenseTrackerMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true

  ExpenseTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Shared/Sources
      - path: Shared/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.expensetracker.tests
        INFOPLIST_GENERATION: true
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: false

schemes:
  ExpenseTrackerMac:
    build:
      targets:
        ExpenseTrackerMac: all
        ExpenseTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ExpenseTrackerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
